[project]
name = "fam"
version = "0.3.12"
description = "Personal CRM as a Claude Code plugin backed by Obsidian markdown."
requires-python = ">=3.13"
dependencies = [
  "python-frontmatter>=1.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: hits the real obsidian CLI; skip in CI without it",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
include = ["scripts", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[project.scripts]
fam-tend = "scripts.fam_tend:main"
fam-today = "scripts.fam_today:main"
fam-validate = "scripts.fam_validate:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.uv]
package = true
