[project]
name = "fam"
version = "0.1.0"
description = "Personal CRM as a Claude Code plugin backed by Obsidian markdown."
requires-python = ">=3.11"
dependencies = [
  "python-frontmatter>=1.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: hits the real obsidian CLI; skip in CI without it",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
include = ["scripts", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.uv]
package = false
